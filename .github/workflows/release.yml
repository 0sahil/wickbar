name: Release

# Push a tag like v0.1.0 (must match the VERSION file). Builds a Developer ID signed,
# notarized and stapled Wickbar.app and attaches it, with the Sparkle appcast.xml, to a DRAFT GitHub release.
# Review the draft's notes, then publish it by hand. Publishing is what makes the update visible to installed
# copies: they read releases/latest/download/appcast.xml, and drafts don't count as "latest".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check tag matches VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "v$v" ]]; then
            echo "::error::Tag $TAG does not match VERSION file ($v)"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Check signing secrets are configured
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          KEY: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ -n "$P12" ]] || { echo "::error::Secret DEVELOPER_ID_P12_BASE64 is missing (see docs/RELEASING.md)"; exit 1; }
          [[ -n "$KEY" ]] || { echo "::error::Secret NOTARY_API_KEY_BASE64 is missing (see docs/RELEASING.md)"; exit 1; }
          [[ -n "$ED_KEY" ]] || { echo "::error::Secret SPARKLE_ED_PRIVATE_KEY is missing (see docs/RELEASING.md)"; exit 1; }

      - name: Test
        run: swift test

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          [[ -n "$IDENTITY" ]] || { echo "::error::No 'Developer ID Application' identity in the p12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write notary API key
        env:
          KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: bash scripts/package-release.sh

      # Signs the zip (the update archive Sparkle downloads) with the EdDSA key, passed to sign_update on
      # stdin so it never touches disk, and checks the signature against the app's SUPublicEDKey.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bash scripts/make-appcast.sh

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then echo "Wickbar $VERSION" > "$RUNNER_TEMP/notes.md"; fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/Wickbar-$VERSION.zip"
          DMG="build/Wickbar-$VERSION.dmg"
          APPCAST="build/appcast.xml"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" "$APPCAST" --clobber
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" "$APPCAST" --draft \
              --title "Wickbar $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8"
